server:
  http_port: "8080"
  grpc_port: "9090"
  env: production

database:
  host: ${SUPABASE_DB_HOST}
  port: ${SUPABASE_DB_PORT}
  name: ${SUPABASE_DB_NAME}
  user: ${SUPABASE_DB_USER}
  password: ${SUPABASE_DB_PASSWORD}
  ssl_mode: require
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime: 1200  # seconds

rabbitmq:
  url: ${RABBITMQ_URL}
  exchange: waypoint.events
  queues:
    allocation_completed: loading.allocation
    delivery_completed: delivery.completed
    flag_raised: flag.raised
  routing_keys:
    delivery_completed: delivery.completed
    flag_raised: flag.raised

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

supabase:
  url: ${SUPABASE_URL}
  service_role_key: ${SUPABASE_SERVICE_ROLE_KEY}

logging:
  level: info
