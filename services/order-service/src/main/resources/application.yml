spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${DB_SSLMODE:disable}}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgrespassword}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_order_history
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:waypoint}
    password: ${RABBITMQ_PASSWORD:waypoint}
    virtual-host: ${RABBITMQ_VHOST:waypoint}
    listener.simple:
      acknowledge-mode: manual
      prefetch: 10
server:
  port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,metrics
waypoint:
  timezone: Asia/Colombo
  cutoff: "16:00"
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-ms: ${OUTBOX_POLL_MS:500}
