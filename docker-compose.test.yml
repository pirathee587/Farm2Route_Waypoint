version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    container_name: waypoint-loading-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: waypoint_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase/test_bootstrap.sql:/docker-entrypoint-initdb.d/000_bootstrap.sql:ro
      - ./supabase/migrations/20260927000001_auth_schema.sql:/docker-entrypoint-initdb.d/001_auth.sql:ro
      - ./supabase/migrations/20260927000002_order_schema.sql:/docker-entrypoint-initdb.d/002_order.sql:ro
      - ./supabase/migrations/20260927000003_planning_schema.sql:/docker-entrypoint-initdb.d/003_planning.sql:ro
      - ./supabase/migrations/20260927000004_loading_delivery_schema.sql:/docker-entrypoint-initdb.d/004_loading_delivery.sql:ro
      - ./supabase/migrations/20261003000001_loader_workflow.sql:/docker-entrypoint-initdb.d/005_loader_workflow.sql:ro
      - ./supabase/migrations/20261003000002_loader_seed.sql:/docker-entrypoint-initdb.d/006_loader_seed.sql:ro
      - ./supabase/migrations/20261003000003_loader_seed_fix.sql:/docker-entrypoint-initdb.d/007_loader_seed_fix.sql:ro
      - ./supabase/migrations/20261003000004_progress_fix.sql:/docker-entrypoint-initdb.d/008_progress_fix.sql:ro
      - ./supabase/migrations/20261003000005_seed_fidelity.sql:/docker-entrypoint-initdb.d/009_seed_fidelity.sql:ro
      - ./supabase/migrations/20261003000006_notification_schema.sql:/docker-entrypoint-initdb.d/010_notification_schema.sql:ro
      - ./supabase/migrations/20261003000007_seed_times.sql:/docker-entrypoint-initdb.d/011_seed_times.sql:ro
      - ./supabase/migrations/20261003000008_allocation_consumer.sql:/docker-entrypoint-initdb.d/012_allocation_consumer.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waypoint_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test-rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: waypoint-loading-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: waypoint-loading-test-cookie
      HOME: /tmp/rabbitmq
      RABBITMQ_MNESIA_BASE: /tmp/rabbitmq/mnesia
      RABBITMQ_LOG_BASE: /tmp/rabbitmq/log
    ports:
      - "5673:5672"
    tmpfs:
      - /tmp/rabbitmq:mode=1777
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
