apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delivery
  namespace: waypoint-dev
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - api-gateway
  - auth-service
  - order-service
  - planning-service
  - loading-delivery-service
  - notification-service
  verbs:
  - get
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delivery
  namespace: waypoint-dev
subjects:
- kind: Group
  name: waypoint-delivery
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: delivery
  apiGroup: rbac.authorization.k8s.io
