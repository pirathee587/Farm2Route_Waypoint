---
- name: Verify common runtime dependencies from Kubernetes
  hosts: runners
  gather_facts: false
  tasks:
    - name: Check broker health
      ansible.builtin.command:
        argv: [kubectl, '--kubeconfig', "{{ waypoint_kubeconfig }}", -n, "{{ waypoint_namespace }}", exec, statefulset/rabbitmq, --, rabbitmq-diagnostics, -q, ping]
      changed_when: false
      check_mode: false

    - name: Verify database TLS without changing application data
      when: not ansible_check_mode
      block:
        - name: Choose an isolated diagnostic job name
          ansible.builtin.set_fact:
            waypoint_db_check_name: "waypoint-db-check-{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}"

        - name: Create a short-lived TLS diagnostic job
          ansible.builtin.command:
            argv: [kubectl, '--kubeconfig', "{{ waypoint_kubeconfig }}", create, -f, '-']
            stdin: "{{ lookup('ansible.builtin.template', 'templates/db-check.yml.j2') }}"
          changed_when: true

        - name: Wait for verified database connection
          ansible.builtin.command:
            argv: [kubectl, '--kubeconfig', "{{ waypoint_kubeconfig }}", -n, "{{ waypoint_namespace }}", wait, '--for=condition=complete', "job/{{ waypoint_db_check_name }}", '--timeout=120s']
          changed_when: false
      always:
        - name: Read diagnostic result without application records or credentials
          ansible.builtin.command:
            argv: [kubectl, '--kubeconfig', "{{ waypoint_kubeconfig }}", -n, "{{ waypoint_namespace }}", logs, "job/{{ waypoint_db_check_name }}", '--tail=20']
          register: waypoint_db_result
          changed_when: false
          failed_when: false
          when: waypoint_db_check_name is defined

        - name: Show connection result
          ansible.builtin.debug:
            msg: "{{ waypoint_db_result.stdout | default('Diagnostic job did not start.') }}"

        - name: Remove only this run's diagnostic job
          ansible.builtin.command:
            argv: [kubectl, '--kubeconfig', "{{ waypoint_kubeconfig }}", -n, "{{ waypoint_namespace }}", delete, job, "{{ waypoint_db_check_name }}", '--ignore-not-found=true', '--wait=false']
          changed_when: true
          when: waypoint_db_check_name is defined
