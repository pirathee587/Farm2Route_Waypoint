---
- name: Require the supported runner platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Amazon'
      - ansible_facts['distribution_major_version'] == '2023'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: This role supports the existing Amazon Linux 2023 x86_64 runner.

- name: Install common OS and Java build dependencies
  ansible.builtin.dnf:
    name: "{{ waypoint_runner_packages }}"
    state: present

- name: Install the remaining CI language toolchains
  ansible.builtin.dnf:
    name: "{{ waypoint_ci_packages }}"
    state: present
  when: waypoint_install_ci_toolchains | bool

- name: Enable Docker without restarting a running daemon
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create versioned tool and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ waypoint_tool_dir }}/kubectl/{{ waypoint_kubectl_version }}"
    - "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}"
    - /var/tmp/trivy
    - "{{ waypoint_state_dir }}"

- name: Install checksum-verified kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ waypoint_kubectl_version }}/bin/linux/amd64/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ waypoint_kubectl_version }}/bin/linux/amd64/kubectl.sha256"
    dest: "{{ waypoint_tool_dir }}/kubectl/{{ waypoint_kubectl_version }}/kubectl"
    mode: '0755'

- name: Download checksum-verified Trivy archive
  ansible.builtin.get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ waypoint_trivy_version }}/trivy_{{ waypoint_trivy_version }}_Linux-64bit.tar.gz"
    checksum: "sha256:https://github.com/aquasecurity/trivy/releases/download/v{{ waypoint_trivy_version }}/trivy_{{ waypoint_trivy_version }}_checksums.txt"
    dest: "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}/trivy.tar.gz"
    mode: '0644'

- name: Extract pinned Trivy binary
  ansible.builtin.unarchive:
    src: "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}/trivy.tar.gz"
    dest: "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
    include:
      - trivy
    creates: "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}/trivy"
  when: not ansible_check_mode

- name: Select managed CLI versions
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ waypoint_tool_dir }}/kubectl/{{ waypoint_kubectl_version }}/kubectl"
      dest: /usr/local/bin/kubectl
    - src: "{{ waypoint_tool_dir }}/trivy/{{ waypoint_trivy_version }}/trivy"
      dest: /usr/local/bin/trivy
  when: not ansible_check_mode

- name: Verify installed toolchain
  ansible.builtin.command:
    argv: "{{ item }}"
  changed_when: false
  loop:
    - [java, -version]
    - [mvn, -version]
    - [docker, info, '--format', '{{ "{{.ServerVersion}}" }}']
    - [aws, --version]
    - [/usr/local/bin/kubectl, version, --client, -o, json]
    - [/usr/local/bin/trivy, --version]
  when: not ansible_check_mode

- name: Verify CI language toolchains
  ansible.builtin.command:
    argv: "{{ item }}"
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'
  changed_when: false
  loop:
    - [go, version]
    - [dotnet, --list-sdks]
    - [node, --version]
    - [npm, --version]
  when:
    - waypoint_install_ci_toolchains | bool
    - not ansible_check_mode
