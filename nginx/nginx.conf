# ═══════════════════════════════════════════════════════════════════════════
#  Waypoint Delivery Planning System — Nginx Configuration
#  - HTTP  (80)  → Redirect to HTTPS
#  - HTTPS (443) → SSL termination → API Gateway + Static Frontend
#  - WebSocket upgrade for /api/notify/ws
# ═══════════════════════════════════════════════════════════════════════════

# Tune worker processes to match available CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    # ── MIME & Basics ──────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;
    server_tokens      off;   # Hide nginx version

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Rate Limiting ──────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Upstream: API Gateway ──────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    # ── WebSocket map (upgrade header handling) ────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ══════════════════════════════════════════════════════════════════════
    #  SERVER 1 — HTTP (port 80) → Permanent redirect to HTTPS
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # ACME challenge support (Let's Encrypt, if used in prod)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════
    #  SERVER 2 — HTTPS (port 443) — SSL Termination + Reverse Proxy
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name localhost waypoint.local;

        # ── SSL Certificate (self-signed for local dev) ──────────────────
        ssl_certificate     /etc/nginx/certs/waypoint.crt;
        ssl_certificate_key /etc/nginx/certs/waypoint.key;

        # ── SSL Hardening ─────────────────────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS (enable only when cert is trusted; comment out for self-signed)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security Headers ──────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"               always;
        add_header X-XSS-Protection          "1; mode=block"            always;
        add_header X-Content-Type-Options    "nosniff"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(self)"       always;

        # ── Client Request Limits ─────────────────────────────────────────
        client_max_body_size 20m;

        # ── Root → Serve React Build (SPA) ───────────────────────────────
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires     1y;
                add_header  Cache-Control "public, immutable";
                access_log  off;
            }
        }

        # ── /api/auth/** → Auth Service (via API Gateway) ─────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── /api/notify/ws → WebSocket (Notification Service) ─────────────
        location /api/notify/ws {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Long timeout for persistent WebSocket connections
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── /api/** → API Gateway (all other services) ────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # ── Health Check endpoint ─────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # ── Block common attack paths ─────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
