## RabbitMQ Configuration for Waypoint

# Default vhost is already set via RABBITMQ_DEFAULT_VHOST env var in docker-compose.
# This file is for additional tuning.

loopback_users.guest = false
listeners.tcp.default = 5672

# Management plugin
management.tcp.port = 15672

# Heartbeat — keep connections alive across load balancers
heartbeat = 60

# Message persistence
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Consumer prefetch (fair dispatch)
channel_max = 2047
